server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
  resolver_timeout 5s;

  set $news_upstream "www.worldmonitor.app";

  # Main proxied page (and any /news-proxy/... deep links).
  location /news-proxy/ {
    proxy_pass https://$news_upstream/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $news_upstream;
    proxy_set_header Host $news_upstream;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Referer https://$news_upstream/;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Strict-Transport-Security;

    add_header Cache-Control "no-store" always;

    proxy_redirect https://$news_upstream/ /news-proxy/;
    proxy_redirect / /news-proxy/;

    # Rewrite absolute upstream URLs so they stay same-origin, and neutralise
    # the meta CSP tag injected by the site.
    sub_filter 'https://www.worldmonitor.app/' '/news-proxy/';
    sub_filter 'https://worldmonitor.app/' '/news-proxy/';
    sub_filter '<meta http-equiv="Content-Security-Policy"' '<meta data-disabled="csp"';
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript application/json;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # The upstream's static assets sit at `/assets/*`, `/favico/*`, `/_next/*`,
  # and a handful of other top-level paths. Our own Vite build emits under
  # `/app-assets/` so these paths don't collide. Forward them to the upstream
  # unconditionally.
  location ~ ^/(assets|_next|__nextjs|static|cdn-cgi|fonts|images|media|favico|sw\.js|manifest\.webmanifest|site\.webmanifest|sitemap\.xml|robots\.txt)(/|$) {
    proxy_pass https://$news_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $news_upstream;
    proxy_set_header Host $news_upstream;
    proxy_set_header Referer https://$news_upstream/;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # Runtime JSON/XHR calls from the upstream's scripts (e.g. fetch('/api/...'))
  # will hit us at the document origin. Forward them to the upstream.
  location /api/ {
    proxy_pass https://$news_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $news_upstream;
    proxy_set_header Host $news_upstream;
    proxy_set_header Referer https://$news_upstream/;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
