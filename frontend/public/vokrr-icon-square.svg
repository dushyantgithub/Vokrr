<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Vokrr home automation">
  <title>Vokrr</title>
  <defs>
    <linearGradient id="vokrr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#0b0b0d"/>
      <stop offset="100%" stop-color="#0a1416"/>
    </linearGradient>
    <linearGradient id="vokrr-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbb3ff"/>
      <stop offset="100%" stop-color="#8fd3ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square panel -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#vokrr-bg)"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="109.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
  <!-- Subtle "home" roof: suggests smart home / automation context -->
  <path d="M 176 188 L 256 118 L 336 188" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- V mark: voice + V for Vokrr -->
  <path d="M 200 200 L 256 318" fill="none" stroke="url(#vokrr-brand)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 312 200 L 256 318" fill="none" stroke="url(#vokrr-brand)" stroke-width="24" stroke-linecap="round"/>
  <!-- Connection hub: device / network anchor -->
  <circle cx="256" cy="338" r="12" fill="#8fd3ff" stroke="#cbb3ff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Wordmark -->
  <text x="256" y="420" text-anchor="middle" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700" fill="#ffffff" fill-opacity="0.95" letter-spacing="-0.5">Vokrr</text>
</svg>
