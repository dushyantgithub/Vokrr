[project]
name = "vokrr-voice-listener"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "faster-whisper>=1.1.0",
  "httpx>=0.27.0",
  "nvidia-riva-client>=2.19.0",
  "numpy>=1.26.0",
  "pvporcupine>=3.0.0",
  "sounddevice>=0.5.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.setuptools]
py-modules = ["listener"]

[tool.setuptools.packages.find]
include = ["services*"]
