name: vokrr

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: vokrr-ha
    restart: unless-stopped
    privileged: true
    network_mode: host
    env_file:
      - ../scripts/.env
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ../home-assistant/config:/config

  backend:
    build:
      context: ../backend
    container_name: vokrr-backend
    restart: unless-stopped
    network_mode: host
    pid: host
    privileged: true
    env_file:
      - ../scripts/.env
    environment:
      DEVICE_CONFIG_PATH: /app/config/devices.yaml
      COMMAND_CONFIG_PATH: /app/config/commands.yaml
    volumes:
      - ../home-assistant/config/devices.yaml:/app/config/devices.yaml:ro
      - ../home-assistant/config/commands.yaml:/app/config/commands.yaml:ro
      - ../backend/data:/app/data
    depends_on:
      - homeassistant

  frontend:
    build:
      context: ../frontend
    container_name: vokrr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  voice-intent:
    build:
      context: ../voice-pipeline/intent
    container_name: vokrr-voice-intent
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../scripts/.env
    depends_on:
      - backend

  voice-listener:
    build:
      context: ../voice-pipeline/listener
    container_name: vokrr-voice-listener
    restart: unless-stopped
    network_mode: host
    privileged: true
    env_file:
      - ../scripts/.env
    environment:
      PORCUPINE_KEYWORD_PATH: /wake-word/Jarvis_en_raspberry-pi_v4_0_0.ppn
    volumes:
      - ../wake-word:/wake-word:ro
    devices:
      - /dev/snd:/dev/snd
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vokrr-cloudflared
    restart: unless-stopped
    profiles:
      - cloudflare
    network_mode: host
    env_file:
      - ../scripts/.env
    command: tunnel --no-autoupdate run
    depends_on:
      - backend
