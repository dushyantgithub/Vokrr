name: vokrr

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: vokrr-ha
    restart: unless-stopped
    privileged: true
    network_mode: host
    env_file:
      - ../scripts/.env
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ../home-assistant/config:/config

  backend:
    build:
      context: ../backend
    container_name: vokrr-backend
    restart: unless-stopped
    network_mode: host
    pid: host
    privileged: true
    env_file:
      - ../scripts/.env
    environment:
      DEVICE_CONFIG_PATH: /app/config/devices.yaml
      COMMAND_CONFIG_PATH: /app/config/commands.yaml
    volumes:
      - ../home-assistant/config/devices.yaml:/app/config/devices.yaml:ro
      - ../home-assistant/config/commands.yaml:/app/config/commands.yaml:ro
      - ../backend/data:/app/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    depends_on:
      - homeassistant

  spotify-connect:
    image: giof71/librespot:latest
    container_name: vokrr-spotify-connect
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../backend/data/audio-output.env
    devices:
      - /dev/snd:/dev/snd
    environment:
      BACKEND: alsa
      BITRATE: 320
      INITIAL_VOLUME: 80
      DEVICE_NAME: Vokrr
      DEVICE_TYPE: speaker
      ENABLE_SYSTEM_CACHE: "Y"
      ENABLE_CACHE: "Y"
      AUDIO_GID: 29
    volumes:
      - ../backend/data/librespot-cache:/data/cache
      - ../backend/data/librespot-system-cache:/data/system-cache

  voice-intent:
    build:
      context: ../voice-pipeline/intent
    container_name: vokrr-voice-intent
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../scripts/.env
    depends_on:
      - backend

  voice-listener:
    build:
      context: ..
      dockerfile: voice-pipeline/listener/Dockerfile
    container_name: vokrr-voice-listener
    restart: unless-stopped
    network_mode: host
    privileged: true
    env_file:
      - ../scripts/.env
      - ../.env
      - ../backend/data/audio-output.env
    environment:
      PORCUPINE_KEYWORD_PATH: /wake-word/Jarvis_en_raspberry-pi_v4_0_0.ppn
    volumes:
      - ../wake-word:/wake-word:ro
    devices:
      - /dev/snd:/dev/snd
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vokrr-cloudflared
    restart: unless-stopped
    profiles:
      - cloudflare
    network_mode: host
    env_file:
      - ../scripts/.env
    command: tunnel --no-autoupdate run
    depends_on:
      - backend
